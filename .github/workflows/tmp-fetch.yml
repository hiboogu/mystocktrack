name: tmp fetch
on:
  push:
    branches: [claude/project-thread-xmmgyk]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance
      - run: python tmpfetch/fetch.py ${{ contains(github.event.head_commit.message, 'jp-only') && 'jp' || 'all' }}
