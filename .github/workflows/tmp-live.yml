name: tmp-live
on:
  push:
    branches: [claude/project-thread-9qpy6c]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas
      - shell: python
        run: |
          import yfinance as yf, pandas as pd
          T=["SPY","QQQ","IWM","SMH","^VIX","BTC-USD","IBIT","^TNX","DX-Y.NYB","CL=F","NVDA","INTC","KBR","PATH","MSTR","CRNC","DAL","OWLS","MSFT","AMZN","GOOGL","META","AVGO","AMD","MU","VRT","CEG","TSM","ORCL","CRWV","RTX"]
          for t in T:
            try:
              d=yf.Ticker(t).history(period="9mo",interval="1d")
              m=yf.Ticker(t).history(period="1d",interval="5m",prepost=False)
              c=d.Close; pc=c.iloc[-2]; last=c.iloc[-1]
              tr=pd.concat([d.High-d.Low,(d.High-c.shift()).abs(),(d.Low-c.shift()).abs()],axis=1).max(axis=1)
              atr=tr.rolling(14).mean().iloc[-1]
              lo10=d.Low.iloc[-11:-1].min(); lo20=d.Low.iloc[-21:-1].min(); lo60=d.Low.iloc[-61:-1].min()
              print(f"{t:9s} last {last:.2f} prev {pc:.2f} chg {100*(last/pc-1):+.2f}% | dayH {d.High.iloc[-1]:.2f} dayL {d.Low.iloc[-1]:.2f} open {d.Open.iloc[-1]:.2f} | 20MA {c.rolling(20).mean().iloc[-1]:.2f} 50MA {c.rolling(50).mean().iloc[-1]:.2f} 200MA {c.rolling(200).mean().iloc[-1]:.2f} ATR {atr:.2f} | lo10 {lo10:.2f} lo20 {lo20:.2f} lo60 {lo60:.2f} | vol {d.Volume.iloc[-1]:.0f} avg20 {d.Volume.iloc[-21:-1].mean():.0f} | lastbar {m.index[-1] if len(m) else 'na'}")
            except Exception as e: print(t,"ERR",e)
          print("---last 8 daily closes holdings")
          for t in ["NVDA","INTC","KBR","PATH","MSTR","CRNC","DAL","OWLS"]:
            print(t, [round(x,2) for x in yf.Ticker(t).history(period="12d").Close.tolist()])
          print("---5m path SPY/NVDA/MSTR/BTC")
          for t in ["SPY","QQQ","NVDA","MSTR","BTC-USD"]:
            m=yf.Ticker(t).history(period="1d",interval="15m")
            print(t, [(str(i)[11:16],round(v,2)) for i,v in m.Close.items()][-30:])
          print("---news")
          for t in ["SPY","QQQ","NVDA","^VIX","MSTR","KBR","PATH","INTC","CRNC","DAL","OWLS","BTC-USD"]:
            try:
              for n in yf.Ticker(t).news[:6]:
                c=n.get("content",n); print(t,"|",c.get("pubDate",c.get("providerPublishTime")),"|",c.get("title"))
            except Exception as e: print(t,"news ERR",e)
