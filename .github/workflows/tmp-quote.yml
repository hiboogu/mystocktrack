name: tmp-quote
on:
  push:
    branches: [claude/project-thread-abruxz]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yfinance
      - shell: python
        run: |
          import yfinance as yf
          for t in "SHLS IE FRVO BULL CLSK CIFR NVTS VNET NOK USAR SOUN".split():
              try:
                  h=yf.Ticker(t).history(period="1y")
                  c=h.Close; hi=h.High.max(); lo=h.Low.min(); p=c.iloc[-1]
                  i=yf.Ticker(t).info
                  print(t, h.index[-1].date(), round(p,3), "hi",round(hi,2),"lo",round(lo,2),"pos%",round((p-lo)/(hi-lo)*100,1),
                        "ma20",round(c.tail(20).mean(),2),"ma50",round(c.tail(50).mean(),2),"ma200",round(c.tail(200).mean(),2),
                        "rec",i.get("recommendationMean"),i.get("numberOfAnalystOpinions"),"tgt",i.get("targetMeanPrice"),i.get("targetLowPrice"),i.get("targetHighPrice"),
                        "earn",i.get("earningsTimestamp"),"short%",i.get("shortPercentOfFloat"),"cash",i.get("totalCash"),"debt",i.get("totalDebt"))
                  print(t,"SUM:",(i.get("longBusinessSummary") or "")[:600])
              except Exception as e: print(t,"ERR",e)
