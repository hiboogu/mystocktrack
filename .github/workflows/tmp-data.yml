name: tmp-data
on:
  push:
    branches: [claude/project-thread-k7g9mk]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas
      - run: python tmpdata/fetch.py
