name: tmp quotes
on:
  push:
    branches: [claude/project-thread-sut3ut]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas
      - shell: python
        run: |
          import yfinance as yf, pandas as pd, json
          pd.set_option("display.width",250); pd.set_option("display.max_rows",400)
          t=yf.Ticker("USAR")
          d=t.history(period="1y",auto_adjust=False)
          c=d["Close"]
          d["MA5"]=c.rolling(5).mean();d["MA10"]=c.rolling(10).mean();d["MA20"]=c.rolling(20).mean();d["MA50"]=c.rolling(50).mean();d["MA200"]=c.rolling(200).mean()
          dl=c.diff();g=dl.clip(lower=0).ewm(alpha=1/14).mean();l=(-dl.clip(upper=0)).ewm(alpha=1/14).mean();d["RSI"]=100-100/(1+g/l)
          tr=pd.concat([d.High-d.Low,(d.High-c.shift()).abs(),(d.Low-c.shift()).abs()],axis=1).max(axis=1);d["ATR"]=tr.rolling(14).mean()
          d["V20"]=d.Volume.rolling(20).mean()
          print(d[["Open","High","Low","Close","Volume","V20","MA5","MA10","MA20","MA50","MA200","RSI","ATR"]].tail(45).round(3).to_string())
          print("52w hi/lo",d.High.max(),d.Low.min(), "ret std daily", c.pct_change().tail(60).std())
          ib=t.history(period="5d",interval="30m",prepost=True); print(ib.round(3).to_string())
          for k in ["marketCap","sharesOutstanding","floatShares","shortPercentOfFloat","sharesShort","sharesShortPriorMonth","totalCash","totalDebt","totalRevenue","targetMeanPrice","targetLowPrice","targetHighPrice","numberOfAnalystOpinions","recommendationKey","beta","heldPercentInstitutions","fiftyTwoWeekHigh","fiftyTwoWeekLow","preMarketPrice","postMarketPrice","regularMarketPrice"]:
              print(k,t.info.get(k))
          try: print(t.calendar)
          except Exception as e: print(e)
          try: print(t.earnings_dates)
          except Exception as e: print(e)
          try:
              for n in t.news[:12]:
                  c2=n.get("content",n); print(c2.get("pubDate"),c2.get("title"),(c2.get("canonicalUrl") or {}).get("url"))
          except Exception as e: print(e)
          try: print(t.quarterly_income_stmt.iloc[:,:5].to_string())
          except Exception as e: print(e)
          try: print(t.quarterly_balance_sheet.loc[[x for x in ["Cash And Cash Equivalents","Cash Cash Equivalents And Short Term Investments","Total Debt","Ordinary Shares Number"] if x in t.quarterly_balance_sheet.index]].iloc[:,:4].to_string())
          except Exception as e: print(e)
          for s in ["SPY","QQQ","IWM","^VIX","^TNX","REMX","MP","UAMY","CRML","LAC","DX-Y.NYB","ES=F","NQ=F","RTY=F"]:
              h=yf.Ticker(s).history(period="1mo")
              print(s, h.Close.tail(6).round(3).to_dict())
