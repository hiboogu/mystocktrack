name: tmp quotes
on:
  push:
    branches: [claude/project-thread-sut3ut]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas
      - shell: python
        run: |
          import yfinance as yf, warnings
          warnings.filterwarnings("ignore")
          names={"600111.SS":"北方稀土","600392.SS":"盛和資源","000831.SZ":"中國稀土","600259.SS":"廣晟有色","300748.SZ":"金力永磁","000970.SZ":"中科三環","LYC.AX":"Lynas","ILU.AX":"Iluka","ARU.AX":"Arafura","ASM.AX":"Australian Strategic Materials","VML.AX":"Vital Metals","5714.T":"DOWA","6988.T":"日東電工(ref)","000001.SS":"上證","^AXJO":"ASX200","^N225":"日經","^HSI":"恆生","USAR":"USAR","MP":"MP","REMX":"REMX"}
          for s,n in names.items():
              try:
                  h=yf.Ticker(s).history(period="10d")
                  c=h.Close; i=yf.Ticker(s).history(period="1d",interval="5m")
                  last=i.Close.iloc[-1] if len(i) else None; lt=i.index[-1] if len(i) else None
                  print(f"QQ {s} {n} closes={c.tail(5).round(3).tolist()} dates={[d.strftime('%m-%d') for d in c.tail(5).index]} chg_last={round((c.iloc[-1]/c.iloc[-2]-1)*100,2)} intraday_last={last} at {lt}")
              except Exception as e: print("QQ",s,"ERR",e)
