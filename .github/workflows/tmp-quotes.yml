name: tmp quotes
on:
  push:
    branches: [claude/project-thread-prsi6p]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas
      - name: quotes
        shell: python
        run: |
          import yfinance as yf
          T=["SPY","QQQ","IWM","SMH","^SOX","NVDA","AMD","AVGO","MU","INTC","TSM","MSFT","META","GOOGL","AMZN","VRT","CEG","RTX","LMT","NOC","GD","ITA","GE","MSTR","BTC-USD","IBIT","COIN","CIFR","CLSK","KBR","PATH","CRNC","DAL","OWLS","XLV","XLE","XLF","^VIX","^TNX","DX-Y.NYB","GC=F","CL=F"]
          for t in T:
            try:
              d=yf.Ticker(t).history(period="5d")
              h=yf.Ticker(t).history(period="1d",interval="5m")
              prev=d["Close"].iloc[-2]; last=h["Close"].iloc[-1]
              print(f"{t:9s} prev {prev:10.2f} last {last:10.2f} {100*(last/prev-1):+6.2f}%  hi {h['High'].max():.2f} lo {h['Low'].min():.2f} vol {int(h['Volume'].sum())} t {h.index[-1].strftime('%H:%M')}")
            except Exception as e: print(t,"ERR",e)
          for t in ["RTX","NVDA","INTC","MSTR","LMT","^GSPC","BTC-USD"]:
            try:
              for n in yf.Ticker(t).news[:7]:
                c=n.get("content",n); print(t,"|",c.get("pubDate"),"|",c.get("title"))
            except Exception as e: print(t,"ERR",e)
