name: tmp-quotes
on:
  push:
    branches: [claude/project-thread-r1cw8w]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas
      - shell: python
        run: |
          import yfinance as yf, pandas as pd, datetime as dt, numpy as np, warnings
          warnings.filterwarnings("ignore")
          pd.set_option("display.width",250); pd.set_option("display.max_columns",30); pd.set_option("display.max_rows",500)
          print("UTC now", dt.datetime.utcnow())
          t=yf.Ticker("INTC")
          h=t.history(period="1d",interval="1m")
          px=h["Close"].iloc[-1]; print("PX",round(px,2),"time",h.index[-1], "low", h["Low"].min(), "high", h["High"].max())
          d=t.history(period="1y")
          r=np.log(d["Close"]).diff()
          for n in (10,20,60,250): print("HV",n, round(r.tail(n).std()*np.sqrt(252)*100,1))
          exps=t.options; print("EXPS",exps)
          want=[e for e in exps if e<="2026-12-31"][:8]+[e for e in exps if e.startswith("2027-01") or e.startswith("2027-06") or e.startswith("2028-01") or e.startswith("2028-06")]
          for e in want:
              try:
                  oc=t.option_chain(e)
              except Exception as ex:
                  print(e,"ERR",ex); continue
              for nm,df in (("CALL",oc.calls),("PUT",oc.puts)):
                  df=df[(df.strike>=px*0.7)&(df.strike<=px*1.35)]
                  df=df[["strike","lastPrice","bid","ask","impliedVolatility","volume","openInterest"]].copy()
                  df["iv"]=(df.impliedVolatility*100).round(1); df=df.drop(columns="impliedVolatility")
                  print(f"\n### {e} {nm}"); print(df.to_string(index=False))
