name: tmp owls
on:
  push:
    branches: [claude/project-thread-bkxrt7]
    paths: [".github/workflows/tmp-owls.yml","tmpq/**"]
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas numpy
      - run: python tmpq/owls.py
