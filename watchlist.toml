# category = 長期／短線／投機（投機自動視為 speculative：部位上限、停損與催化劑判斷）
# stop = 和 Max 約定的收盤停損價，取代系統算的停損參考
# 可加 catalyst = "等待的題材" 與 review_by = "2027-06-30"（到期重新檢討）。
NVDA = { cost = 213.271, shares = 10, category = "長期", stop = 190 }  # 10/30 210x5 成交
