# 有持股的標的放在 [holdings]，會自動納入分析，不必再列進 tickers。

[long_term]
# 長期配置：目前沒有持股、想持續觀察的標的
# 日股用東京證交所代號加 .T，價格以日圓計
# 2026-10-28 Max 的三大類（只是標籤，分析仍走長期流程）：
#   長期：AMD、HON、TRMB、IOT、Lasertec、Keyence、Fujikura
#   短線（10 萬分散短線池）：DHR、DVN、CRBG（DAL 10/30 已買進，移到持股）
#   投機（低價 AI／避險篩選）：FRVO、IE、USAR（2026-10-28 已全數賣出，改回僅觀察）
tickers = [
  "AMD", "HON", "TRMB", "IOT", "6920.T", "6861.T", "5803.T",
  "DHR", "DVN", "CRBG",
  "FRVO", "IE", "USAR",
]

[short_term]
# 比特幣相關資產，短線進出
