# 觀察清單：美股長期配置 + 比特幣相關資產短線
# 有持股的標的放在 [holdings]，會自動納入分析，不必再列進 tickers。

[long_term]
# 長期配置：目前沒有持股、想持續觀察的標的
# 日股用東京證交所代號加 .T，價格以日圓計
tickers = ["AMD", "HON", "TRMB", "IOT", "6920.T", "6861.T", "5803.T"]

[short_term]
# 比特幣相關資產，短線進出
tickers = ["MSTR"]

[names]
# 報告顯示用的名稱
"6920.T" = "Lasertec"
"6861.T" = "Keyence"
"5803.T" = "Fujikura"

[holdings]
# 目前持股：cost = 平均買進成本（美元／股），shares = 股數
KBR = { cost = 38.1055, shares = 20 }
MSTR = { cost = 126.315, shares = 2 }
PATH = { cost = 18.0451, shares = 78 }
CRNC = { cost = 8.0904, shares = 25 }
SOUN = { cost = 6.0854, shares = 26 }
# speculative = true：題材投機，改用部位上限、硬停損與催化劑判斷。
# 可加 catalyst = "等待的題材" 與 review_by = "2027-06-30"（到期重新檢討）。
OWLS = { cost = 5.3672, shares = 60, speculative = true }
NVDA = { cost = 216, shares = 5 }  # 2026-10-16 買進
INTC = { cost = 91, shares = 2 }   # 2026-10-16 買進

[risk]
max_single_weight = 0.20   # 單一長期持股上限
max_crypto_sleeve = 0.10   # 比特幣相關短線部位占總資產上限
high_volatility = 0.45     # 年化波動率高於此值視為高風險
deep_drawdown = 0.35       # 一年內最大回撤超過此值視為高風險
max_loss_from_cost = 0.30  # 持股虧損超過成本的此比例，且團隊不看多時建議停損
speculative_max_weight = 0.05  # 投機持股占持股總值上限
speculative_max_loss = 0.50    # 投機持股虧損達成本的此比例，硬停損出場
