[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mystocktrack"
version = "0.1.0"
description = "Multi-agent stock research: a portfolio-manager lead agent coordinating fundamentals, macro/sentiment, BTC trader and risk roles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.13",
    "openai>=1.50",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
site = ["markdown>=3.5"]

[project.scripts]
mystocktrack = "mystocktrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format handles line length
